# This is a basic workflow to help you get started with Actions

name: Build

on:
  workflow_dispatch:

jobs:
  buildMac:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Install Haxelib
        run: |
          haxelib setup ~/haxelib
          haxelib --always install hxcpp 4.2.1
          haxelib --always install lime 8.0.2
          haxelib --always install openfl 9.2.2
          haxelib --always install flixel 5.3.1
          haxelib --always install flixel-addons 3.1.0
          haxelib --always install flixel-ui 2.5.0
          haxelib --always install flixel-tools 1.5.1
          haxelib --always install tjson 1.4.0
          haxelib --always install hscript 2.5.0
          haxelib --always install hxCodec 2.6.1
          haxelib --always install hxjsonast
          haxelib --always install hxcpp-debug-server
          haxelib git linc_luajit https://github.com/nebulazorua/linc_luajit
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc
          haxelib git hscript-ex https://github.com/ianharrigan/hscript-ex
          haxelib list

      - name: Create Version Tag
        run: echo "${{github.run_id}}" > VERSION

      - name: Compile
        run: haxelib run lime build mac -debug --app-version="4.0.0-${{ github.run_id}}"

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macBuild
          path: export/debug/macos/bin
